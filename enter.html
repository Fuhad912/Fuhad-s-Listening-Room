<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b3c36" />
    <meta name="description" content="Enter page for Fuhad Music Room." />
    <title>Enter | Fuhad Music Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/nav.js" defer></script>
    <script src="/js/enter.js" defer></script>
  </head>
  <body class="enter-page">
    <div class="cosmos-bg" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <span class="stars"></span>
    </div>

    <main class="dashboard-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="kicker">Private Entry</p>
          <h1>Fuhad Music Room</h1>
        </div>
        <div class="topbar-actions">
          <a class="btn btn-secondary" href="/index.html">Home</a>
          <a class="btn btn-primary" href="/api/logout">Logout</a>
        </div>
      </header>

      <section class="panel enter-hero" aria-labelledby="enter-heading">
        <p class="kicker">Session</p>
        <h2 id="enter-heading">Preparing your Spotify analytics room.</h2>
        <p id="enter-greeting" class="subtle-text">Checking Spotify session...</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="/app.html">Open Analytics</a>
          <a class="btn btn-secondary" href="/api/logout">Logout</a>
        </div>
      </section>

      <section id="enter-snapshot" class="panel" aria-labelledby="enter-snapshot-heading">
        <div class="panel-head">
          <div>
            <p class="kicker">Quick Snapshot</p>
            <h2 id="enter-snapshot-heading">Latest profile highlights</h2>
          </div>
          <button id="enter-reload" class="btn btn-ghost btn-small" type="button">Reload</button>
        </div>

        <div class="snapshot-grid">
          <article class="snapshot-card">
            <span class="snapshot-label">Top Track</span>
            <strong id="enter-top-track">Loading...</strong>
            <p id="enter-top-track-meta" class="subtle-text"></p>
          </article>
          <article class="snapshot-card">
            <span class="snapshot-label">Top Artist</span>
            <strong id="enter-top-artist">Loading...</strong>
            <p id="enter-top-artist-meta" class="subtle-text"></p>
          </article>
          <article class="snapshot-card">
            <span class="snapshot-label">Recently Played</span>
            <strong id="enter-recent-track">Loading...</strong>
            <p id="enter-recent-track-meta" class="subtle-text"></p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>

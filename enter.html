<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Room page for Fuhad Music Room." />
    <title>Room | Fuhad Music Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
    <script src="/js/animations.js" defer></script>
    <script src="/js/nav.js" defer></script>
    <script src="/js/enter.js" defer></script>
  </head>
  <body class="enter-page room-page">
    <div class="cosmos-bg" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <span class="stars"></span>
    </div>

    <main class="dashboard-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="kicker">Room</p>
          <h1>Fuhad Music Room</h1>
        </div>
        <div class="topbar-actions">
          <a class="btn btn-secondary" href="/index.html">Home</a>
          <a class="btn btn-secondary" href="/app.html">Analytics</a>
          <a class="btn btn-primary" href="/api/logout">Logout</a>
        </div>
      </header>

      <section class="panel tabs-panel room-controls" aria-label="Room range selector">
        <div class="tabs" role="tablist" aria-label="Room listening time range">
          <button class="tab is-active" type="button" role="tab" aria-selected="true" data-range="short_term" data-room-range>
            Week
          </button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-range="medium_term" data-room-range>
            Month
          </button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-range="long_term" data-room-range>
            All Time
          </button>
        </div>
        <div class="room-controls-actions">
          <button id="room-reload" class="btn btn-ghost btn-small" type="button">Reload</button>
        </div>
        <div id="room-status" class="subtle-text">Checking Spotify session...</div>
      </section>

      <section class="dashboard-grid room-grid">
        <section class="panel" aria-labelledby="room-top-tracks-heading">
          <div class="panel-head">
            <div>
              <p class="kicker">Top Tracks</p>
              <h2 id="room-top-tracks-heading">Your Most Played Tracks</h2>
            </div>
          </div>
          <ol id="room-top-tracks" class="room-list"></ol>
        </section>

        <section class="panel" aria-labelledby="room-top-artists-heading">
          <div class="panel-head">
            <div>
              <p class="kicker">Top Artists</p>
              <h2 id="room-top-artists-heading">Artists In Rotation</h2>
            </div>
          </div>
          <ol id="room-top-artists" class="room-list"></ol>
        </section>

        <section class="panel" aria-labelledby="room-top-albums-heading">
          <div class="panel-head">
            <div>
              <p class="kicker">Top Albums</p>
              <h2 id="room-top-albums-heading">Albums You Actually Listen To</h2>
            </div>
          </div>
          <ol id="room-top-albums" class="room-list"></ol>
        </section>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Welcome page for Fuhad Music Room." />
    <title>Fuhad Music Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
    <script src="/js/animations.js" defer></script>
    <script src="/js/home.js" defer></script>
  </head>
  <body class="landing-page">
    <div class="cosmos-bg" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <span class="stars"></span>
    </div>

    <main class="site-shell">
      <section class="panel hero-panel" aria-labelledby="home-hero-heading">
        <p class="kicker">Fuhad Music Room</p>
        <h2 id="home-hero-heading">Welcome Back Fuhad</h2>
        <p class="lede">Choose where you want to go right now.</p>

        <div id="landing-error" class="banner banner-error hidden" role="alert"></div>

        <div class="hero-actions">
          <a class="btn btn-primary" href="/enter.html">Open Room Page</a>
          <a class="btn btn-secondary" href="/app.html">Open Analytics Page</a>
        </div>

        <section class="now-playing-panel" aria-live="polite" aria-label="Now playing">
          <p class="kicker">Now Playing</p>
          <div class="now-playing-card">
            <div id="now-playing-art" class="now-playing-art">
              <div class="now-playing-fallback" aria-hidden="true">NP</div>
            </div>
            <div class="now-playing-body">
              <h3 id="now-playing-title" class="now-playing-title">Checking your Spotify player...</h3>
              <p id="now-playing-meta" class="now-playing-meta">If nothing appears, your player is currently idle.</p>
            </div>
          </div>
          <div class="now-playing-actions">
            <button id="now-playing-refresh" class="btn btn-ghost btn-small" type="button">Refresh</button>
            <a id="now-playing-link" class="btn btn-secondary btn-small hidden" href="#" target="_blank" rel="noreferrer">
              Open in Spotify
            </a>
            <a class="btn btn-ghost btn-small" href="/api/login">Connect Spotify</a>
          </div>
        </section>
      </section>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const rawError = params.get("error");
        if (!rawError) return;
        const banner = document.getElementById("landing-error");
        if (!banner) return;
        banner.textContent = rawError;
        banner.classList.remove("hidden");
      })();
    </script>
  </body>
</html>
